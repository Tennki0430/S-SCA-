name: S-SCA Agents

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行（UTC）
  workflow_dispatch:        # GitHub UI から手動実行も可能

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # 1ジョブあたりの上限（無料枠節約）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Setup Prophet Stan backend
        run: |
          python -c "
          import os, prophet
          stan_dir = os.path.join(os.path.dirname(prophet.__file__), 'stan_model')
          makefile = os.path.join(stan_dir, 'cmdstan-2.33.1', 'Makefile')
          os.makedirs(os.path.dirname(makefile), exist_ok=True)
          if not os.path.exists(makefile):
              open(makefile, 'w').write('# placeholder\n')
              print('Created Makefile for cmdstanpy validation')
          else:
              print('Makefile already exists')
          "

      - name: Run pipeline
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL:     ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY:               ${{ secrets.X_API_KEY }}
          X_API_SECRET:            ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:          ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:         ${{ secrets.X_ACCESS_SECRET }}
          NOTE_EMAIL:              ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD:           ${{ secrets.NOTE_PASSWORD }}
          NOTE_SESSION_COOKIE:     ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_USERNAME:           ${{ secrets.NOTE_USERNAME }}
          AMAZON_ASSOCIATE_TAG:    ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AFFILIATE_THRESHOLD_PCT: ${{ secrets.AFFILIATE_THRESHOLD_PCT }}
        run: python main.py

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **S-SCA パイプライン失敗**\n実行日時: $(date '+%Y-%m-%d %H:%M UTC')\nログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
