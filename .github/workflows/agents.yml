name: S-SCA Agents

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行（UTC）
  workflow_dispatch:        # GitHub UI から手動実行も可能

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # CmdStan キャッシュミス時のインストールを考慮して20分に設定

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache CmdStan for Prophet
        uses: actions/cache@v4
        with:
          path: ~/.cache/prophet-cmdstan
          key: prophet-cmdstan-2.33.1-${{ runner.os }}-v1

      - name: Install CmdStan into Prophet package directory
        run: |
          python -u -c "
          import prophet, cmdstanpy, shutil
          from pathlib import Path

          # Prophet 1.1.5 は site-packages/prophet/stan_model/cmdstan-2.33.1 を期待する
          prophet_stan_dir = Path(prophet.__file__).parent / 'stan_model'
          prophet_cmdstan = prophet_stan_dir / 'cmdstan-2.33.1'
          cache_dir = Path.home() / '.cache' / 'prophet-cmdstan'

          print('prophet_stan_dir:', prophet_stan_dir)
          print('prophet_cmdstan 存在:', prophet_cmdstan.is_dir())

          def is_valid_cmdstan(path):
              try:
                  cmdstanpy.set_cmdstan_path(str(path))
                  return True
              except Exception:
                  return False

          # キャッシュが有効なら prophet ディレクトリへコピー
          if not is_valid_cmdstan(prophet_cmdstan) and cache_dir.is_dir():
              print('キャッシュから prophet ディレクトリへ復元中...')
              if prophet_cmdstan.exists():
                  shutil.rmtree(str(prophet_cmdstan))
              shutil.copytree(str(cache_dir), str(prophet_cmdstan))
              print('復元完了')

          # それでも無効なら prophet ディレクトリへ新規インストール
          if not is_valid_cmdstan(prophet_cmdstan):
              print('CmdStan 2.33.1 を prophet ディレクトリにインストール中...')
              if prophet_cmdstan.exists():
                  shutil.rmtree(str(prophet_cmdstan))
              cmdstanpy.install_cmdstan(
                  version='2.33.1', dir=str(prophet_stan_dir), progress=False
              )
              # キャッシュへ保存
              if cache_dir.exists():
                  shutil.rmtree(str(cache_dir))
              shutil.copytree(str(prophet_cmdstan), str(cache_dir))
              print('インストール完了・キャッシュ保存済み')
          else:
              print('CmdStan 2.33.1 OK (キャッシュ使用)')

          # 動作確認
          from prophet import Prophet
          import pandas as pd, numpy as np
          rng = np.random.default_rng(42)
          df = pd.DataFrame({'ds': pd.date_range('2024-01-01', periods=30), 'y': rng.random(30) + 100})
          Prophet().fit(df)
          print('Prophet 動作確認 OK')
          " 2>&1
        timeout-minutes: 15

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Restore note session
        env:
          NOTE_SESSION_JSON: ${{ secrets.NOTE_SESSION_JSON }}
        run: |
          if [ -n "$NOTE_SESSION_JSON" ]; then
            mkdir -p ~/.cache/s-sca
            echo "$NOTE_SESSION_JSON" | base64 -d > ~/.cache/s-sca/note_session.json
          fi

      - name: Run pipeline
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL:     ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY:               ${{ secrets.X_API_KEY }}
          X_API_SECRET:            ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:          ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:         ${{ secrets.X_ACCESS_SECRET }}
          NOTE_USERNAME:           ${{ secrets.NOTE_USERNAME }}
          AMAZON_ASSOCIATE_TAG:    ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AFFILIATE_THRESHOLD_PCT: ${{ secrets.AFFILIATE_THRESHOLD_PCT }}
        run: python main.py

      - name: Deploy dashboard to GitHub Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/build_dashboard.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "ci: update dashboard [skip ci]"
          git push

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **S-SCA パイプライン失敗**\n実行日時: $(date '+%Y-%m-%d %H:%M UTC')\nログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
