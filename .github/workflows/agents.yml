name: S-SCA Agents

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行（UTC）
  workflow_dispatch:        # GitHub UI から手動実行も可能

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # CmdStan キャッシュミス時のインストールを考慮して20分に設定

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache CmdStan
        id: cache-cmdstan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.38.0

      - name: Install CmdStan
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='2.38.0', progress=False)"
        timeout-minutes: 12

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Restore note session
        env:
          NOTE_SESSION_JSON: ${{ secrets.NOTE_SESSION_JSON }}
        run: |
          if [ -n "$NOTE_SESSION_JSON" ]; then
            mkdir -p ~/.cache/s-sca
            echo "$NOTE_SESSION_JSON" | base64 -d > ~/.cache/s-sca/note_session.json
          fi

      - name: Run pipeline
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL:     ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY:               ${{ secrets.X_API_KEY }}
          X_API_SECRET:            ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:          ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:         ${{ secrets.X_ACCESS_SECRET }}
          NOTE_SESSION_COOKIE:     ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_USERNAME:           ${{ secrets.NOTE_USERNAME }}
          AMAZON_ASSOCIATE_TAG:    ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AFFILIATE_THRESHOLD_PCT: ${{ secrets.AFFILIATE_THRESHOLD_PCT }}
          PA_API_ACCESS_KEY:       ${{ secrets.PA_API_ACCESS_KEY }}
          PA_API_SECRET_KEY:       ${{ secrets.PA_API_SECRET_KEY }}
        run: python main.py

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **S-SCA パイプライン失敗**\n実行日時: $(date '+%Y-%m-%d %H:%M UTC')\nログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
